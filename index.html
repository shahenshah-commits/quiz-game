<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💎 LUXURY MAHARTHI QUIZ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container luxury-box">
        <!-- HOME SCREEN -->
        <div id="home-screen" class="screen active">
            <div class="logo-box">
                <span class="icon">💎</span>
                <h1>LUXURY QUIZ</h1>
                <p>महान ज्ञान का सफर (बिना रुकावट खेलें)</p>
            </div>
            <div class="menu-box">
                <button class="btn primary-btn" onclick="QuizGame.startQuiz()">▶ रॉयल गेम शुरू करें</button>
                <a href="https://omg10.com/4/11682795" target="_blank" class="btn bonus-btn">🎁 वीआईपी बोनस & इनाम</a>
            </div>
            <div class="stats-footer">
                ⭐ सर्वोच्च स्कोर: <span id="home-highscore">0</span>
            </div>
        </div>

        <!-- QUIZ SCREEN -->
        <div id="quiz-screen" class="screen">
            <div class="quiz-header">
                <span id="question-counter">सवाल 1 / 50</span>
                <span id="score-counter">स्कोर: 0</span>
            </div>
            
            <div class="question-box">
                <h3 id="question-text">सवाल लोड हो रहा है...</h3>
            </div>

            <div class="options-box" id="options-container">
                <!-- ऑप्शंस -->
            </div>

            <!-- फीडबैक और नेक्स्ट बटन -->
            <div id="feedback-container" class="feedback-hidden">
                <h2 id="feedback-text"></h2>
                <button class="btn next-btn" onclick="QuizGame.nextQuestion()">NEXT ➔</button>
            </div>
        </div>

        <!-- RESULT SCREEN -->
        <div id="result-screen" class="screen">
            <div class="result-box">
                <h2>👑 खेल समाप्त!</h2>
                <p>आपका शानदार स्कोर: <span id="final-score">0</span></p>
                <button class="btn primary-btn" onclick="QuizGame.startQuiz()">🔄 दोबारा खेलें</button>
                <button class="btn" onclick="QuizGame.goHome()">🏠 रॉयल होम</button>
            </div>
        </div>
    </div>

    <script>
        const basePool = [
            { q: "भारत की राजधानी क्या है?", options: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"], answer: 1 },
            { q: "सौरमंडल का सबसे बड़ा ग्रह कौन सा है?", options: ["मंगल", "शनि", "बृहस्पति (Jupiter)", "पृथ्वी"], answer: 2 },
            { q: "कंप्यूटर का दिमाग किसे कहा जाता है?", options: ["मॉनिटर", "कीबोर्ड", "CPU", "माउस"], answer: 2 },
            { q: "भारत का राष्ट्रीय पक्षी कौन सा है?", options: ["तोता", "मोर", "कबूतर", "बाज़"], answer: 1 },
            { q: "पानी का रासायनिक सूत्र क्या है?", options: ["CO2", "H2O", "O2", "NaCl"], answer: 1 },
            { q: "दुनिया का सबसे ऊंचा पर्वत कौन सा है?", options: ["K2", "माउंट एवरेस्ट", "कंचनजंगा", "धौलागिरी"], answer: 1 },
            { q: "मनुष्य के शरीर में कुल कितनी हड्डियाँ होती हैं?", options: ["206", "208", "210", "300"], answer: 0 },
            { q: "किस ग्रह को 'लाल ग्रह' (Red Planet) कहा जाता है?", options: ["शुक्र", "मंगल", "बुध", "शनि"], answer: 1 },
            { q: "मोबाइल फोन का आविष्कार किसने किया था?", options: ["ग्राहम बेल", "मार्टिन कूपर", "थॉमस एडिसन", "आइंस्टीन"], answer: 1 },
            { q: "सबसे तेज दौड़ने वाला जानवर कौन सा है?", options: ["शेर", "घोड़ा", "चीता (Cheetah)", "हिरण"], answer: 2 },
            { q: "हवा में सबसे अधिक मात्रा में कौन सी गैस पाई जाती है?", options: ["ऑक्सीजन", "कार्बन डाइऑक्साइड", "नाइट्रोजन", "हाइड्रोजन"], answer: 2 },
            { q: "गेटवे ऑफ इंडिया (Gateway of India) कहाँ स्थित है?", options: ["नई दिल्ली", "मुंबई", "आगरा", "जयपुर"], answer: 1 },
            { q: "विटामिन C की कमी से कौन सा रोग होता है?", options: ["रतौंधी", "बेरी-बेरी", "स्कर्वी", "रिकेट्स"], answer: 2 },
            { q: "भारत के प्रथम राष्ट्रपति कौन थे?", options: ["डॉ. राजेंद्र प्रसाद", "जवाहरलाल नेहरू", "महात्मा गांधी", "सरदार पटेल"], answer: 0 },
            { q: "विश्व का सबसे बड़ा महासागर कौन सा है?", options: ["अटलांटिक", "हिंद महासागर", "प्रशांत महासागर", "आर्कटिक"], answer: 2 },
            { q: "सोने (Gold) का रासायनिक प्रतीक क्या है?", options: ["Ag", "Au", "Fe", "Cu"], answer: 1 },
            { q: "मसालों का बगीचा किस राज्य को कहा जाता है?", options: ["कर्नाटक", "केरल", "असम", "तमिलनाडु"], answer: 1 },
            { q: "स्वतंत्र भारत के पहले प्रधानमंत्री कौन थे?", options: ["लाल बहादुर शास्त्री", "भगत सिंह", "जवाहरलाल नेहरू", "अटल बिहारी वाजपेयी"], answer: 2 },
            { q: "दुनिया की सबसे लंबी नदी कौन सी है?", options: ["अमेज़न", "नील (Nile)", "गंगा", "यांग्त्ज़ी"], answer: 1 },
            { q: "आग बुझाने के लिए किस गैस का उपयोग किया जाता है?", options: ["ऑक्सीजन", "नाइट्रोजन", "कार्बन डाइऑक्साइड", "हीलियम"], answer: 2 },
            { q: "किस जानवर को 'रेगिस्तान का जहाज' कहा जाता है?", options: ["घोड़ा", "हाथी", "ऊँट", "गधा"], answer: 2 },
            { q: "क्रिकेट के एक ओवर में कितनी गेंदें होती हैं?", options: ["5", "6", "7", "8"], answer: 1 },
            { q: "महाभारत का युद्ध कितने दिनों तक चला था?", options: ["10 दिन", "15 दिन", "18 दिन", "20 दिन"], answer: 2 },
            { q: "टेलीविज़न का आविष्कार किसने किया?", options: ["जे.एल. बेयर्ड", "थॉमस एडिसन", "अलेक्जेंडर ग्राहम बेल", "गैलीलियो"], answer: 0 },
            { q: "पृथ्वी का एकमात्र प्राकृतिक उपग्रह कौन सा है?", options: ["मंगल", "चंद्रमा", "टाइटन", "फोबोस"], answer: 1 },
            { q: "मानव शरीर की सबसे बड़ी हड्डी कौन सी है?", options: ["फीमर (जांघ की)", "स्टेपीज़ (कान की)", "रीढ़ की हड्डी", "हाथ की हड्डी"], answer: 0 },
            { q: "किस शहर को 'गुलाबी शहर' (Pink City) कहा जाता है?", options: ["जोधपुर", "उदयपुर", "जयपुर", "जैसलमेर"], answer: 2 },
            { q: "कंप्यूटर का आविष्कार किसने किया?", options: ["चार्ल्स बैबेज", "बिल गेट्स", "स्टीव जॉब्स", "न्यूटन"], answer: 0 },
            { q: "सूर्य क्या है?", options: ["ग्रह", "उपग्रह", "तारा", "धूमकेतु"], answer: 2 },
            { q: "भारत की सबसे पवित्र नदी किसे माना जाता है?", options: ["यमुना", "गंगा", "गोदावरी", "नर्मदा"], answer: 1 },
            { q: "विश्व में कितने महाद्वीप (Continents) हैं?", options: ["5", "6", "7", "8"], answer: 2 },
            { q: "कागज का आविष्कार किस देश में हुआ था?", options: ["भारत", "चीन", "अमेरिका", "रूस"], answer: 1 },
            { q: "एल्फाबेट (Alphabet) कंपनी के वर्तमान CEO कौन हैं?", options: ["सुंदर पिचाई", "मार्क जुकरबर्ग", "सत्या नडेला", "एलोन मस्क"], answer: 0 },
            { q: "नींबू और संतरे में कौन सा विटामिन पाया जाता है?", options: ["विटामिन A", "विटामिन B", "विटामिन C", "विटामिन D"], answer: 2 },
            { q: "गुरुत्वाकर्षण (Gravity) की खोज किसने की थी?", options: ["अल्बर्ट आइंस्टीन", "गैलीलियो", "आइजैक न्यूटन", "निकोलस कोपरनिकस"], answer: 2 },
            { q: "नोबेल पुरस्कार जीतने वाले पहले भारतीय कौन थे?", options: ["सी.वी. रमन", "रवींद्रनाथ टैगोर", "मदर टेरेसा", "अमर्त्य सेन"], answer: 1 },
            { q: "बल्ब का फिलामेंट किस धातु का बना होता है?", options: ["तांबा", "लोहा", "टंगस्टन", "एल्युमिनियम"], answer: 2 },
            { q: "भारतीय संविधान का जनक किसे कहा जाता है?", options: ["महात्मा गांधी", "डॉ. बी.आर. अंबेडकर", "सरदार पटेल", "जवाहरलाल नेहरू"], answer: 1 },
            { q: "ओलिंपिक खेलों का आयोजन कितने वर्षों के अंतराल पर होता है?", options: ["2 वर्ष", "3 वर्ष", "4 वर्ष", "5 वर्ष"], answer: 2 },
            { q: "अंतरिक्ष में जाने वाले पहले इंसान कौन थे?", options: ["नील आर्मस्ट्रांग", "यूरा गागरिन", "राकेश शर्मा", "एडविन एल्ड्रिन"], answer: 1 },
            { q: "विश्व स्वास्थ्य संगठन (WHO) का मुख्यालय कहाँ है?", options: ["न्यूयॉर्क", "जेनेवा", "लंदन", "पेरिस"], answer: 1 },
            { q: "भारतीय मुद्रा (Rupee) का चिन्ह (₹) किसने डिज़ाइन किया था?", options: ["उदय कुमार धर्मलिंगम", "पिंगली वेंकैया", "सत्यजीत रे", "रवींद्रनाथ टैगोर"], answer: 0 },
            { q: "फेसबुक (Facebook) के संस्थापक कौन हैं?", options: ["एलोन मस्क", "मार्क जुकरबर्ग", "बिल गेट्स", "स्टीव जॉब्स"], answer: 1 },
            { q: "खून का रंग लाल किसके कारण होता है?", options: ["प्लाज्मा", "प्लेटलेट्स", "हीमोग्लोबिन", "श्वेत रक्त कोशिकाएं"], answer: 2 },
            { q: "दुनिया का सबसे बड़ा रेगिस्तान कौन सा है?", options: ["थार", "सहारा", "गोबी", "कालाहारी"], answer: 1 },
            { q: "भारत का सबसे छोटा राज्य (क्षेत्रफल में) कौन सा है?", options: ["सिक्किम", "त्रिपुरा", "गोवा", "मिजोरम"],answer: 2 },
            { q: "कंप्यूटर में RAM का फुल फॉर्म क्या है?", options: ["Read Access Memory", "Random Access Memory", "Run All Memory", "Random Active Memory"], answer: 1 },
            { q: "ध्वनि (Sound) की गति सबसे अधिक किसमें होती है?", options: ["हवा में", "पानी में", "ठोस (Solid) में", "निर्वात (Vacuum) में"], answer: 2 },
            { q: "भारत का सर्वोच्च नागरिक सम्मान कौन सा है?", options: ["पद्म विभूषण", "भारत रत्न", "परमवीर चक्र", "अशोक चक्र"], answer: 1 },
            { q: "लीप वर्ष (Leap Year) में कितने दिन होते हैं?", options: ["364", "365", "366", "367"], answer: 2 }
        ];

        let questions = [];
        let currentQIndex = 0;
        let score = 0;
        let highscore = localStorage.getItem('luxury_quiz_highscore') || 0;

        document.getElementById('home-highscore').innerText = highscore;

        function shuffleQuestions(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        const QuizGame = {
            startQuiz() {
                currentQIndex = 0;
                score = 0;
                questions = shuffleQuestions(basePool);
                this.showScreen('quiz-screen');
                this.loadQuestion();
            },

            showScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                document.getElementById(screenId).classList.add('active');
            },

            loadQuestion() {
                if (currentQIndex >= questions.length) {
                    this.endQuiz();
                    return;
                }

                document.getElementById('feedback-container').style.display = 'none';
                
                let qData = questions[currentQIndex];
                document.getElementById('question-counter').innerText = `सवाल ${currentQIndex + 1} / ${questions.length}`;
                document.getElementById('score-counter').innerText = `स्कोर: ${score}`;
                document.getElementById('question-text').innerText = qData.q;

                let optContainer = document.getElementById('options-container');
                optContainer.innerHTML = '';
                optContainer.style.pointerEvents = 'auto';

                qData.options.forEach((opt, index) => {
                    let btn = document.createElement('button');
                    btn.className = 'opt-btn';
                    btn.innerText = opt;
                    btn.onclick = () => this.checkAnswer(index, qData.answer, btn);
                    optContainer.appendChild(btn);
                });
            },

            checkAnswer(selected, correct, btn) {
                let allBtns = document.querySelectorAll('.opt-btn');
                allBtns.forEach(b => b.style.pointerEvents = 'none');

                let feedbackBox = document.getElementById('feedback-container');
                let feedbackText = document.getElementById('feedback-text');
                feedbackBox.style.display = 'block';

                if (selected === correct) {
                    btn.style.background = 'linear-gradient(45deg, #00ff88, #00b359)';
                    btn.style.color = '#000';
                    score += 10;
                    feedbackText.innerHTML = "✅ बिल्कुल सही! (Correct)";
                    feedbackText.style.color = "#00ff88";
                } else {
                    btn.style.background = 'linear-gradient(45deg, #ff4444, #cc0000)';
                    allBtns[correct].style.background = 'linear-gradient(45deg, #00ff88, #00b359)';
                    allBtns[correct].style.color = '#000';
                    feedbackText.innerHTML = "❌ गलत जवाब! (Wrong)";
                    feedbackText.style.color = "#ff4444";
                }
            },

            nextQuestion() {
                currentQIndex++;
                if (currentQIndex >= questions.length) {
                    this.endQuiz();
                } else {
                    this.loadQuestion();
                }
            },

            endQuiz() {
                this.showScreen('result-screen');
                document.getElementById('final-score').innerText = score;
                if (score > highscore) {
                    highscore = score;
                    localStorage.setItem('luxury_quiz_highscore', highscore);
                    document.getElementById('home-highscore').innerText = highscore;
                }
            },

            goHome() {
                this.showScreen('home-screen');
                document.getElementById('home-highscore').innerText = highscore;
            }
        };
    </script>
</body>
</html>
